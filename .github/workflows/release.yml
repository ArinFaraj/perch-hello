# Perch app release workflow for a Rust binary. Copy to
# .github/workflows/release.yml in a new app repo. It builds a static
# aarch64-musl binary, publishes one immutable release per commit (tagged
# sha-<short> from main, <branch>-<short> elsewhere), and calls edge-state's
# ci/bump to move the pin. See docs/STATE-SPEC.md, "Promotion".
#
# The cargo package name must equal the repo name.
#
# Two secrets, both for a GitHub App that may write to edge-state and open pull
# requests on it:
#   EDGE_STATE_APP_ID   the App's numeric id
#   EDGE_STATE_APP_KEY  its private key, the whole .pem
name: build-release
on:
  push:
    branches: [main, dev]
    paths-ignore: ['**/*.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Package
        id: pkg
        run: |
          BIN="${GITHUB_REPOSITORY##*/}"
          cp "target/aarch64-unknown-linux-musl/release/$BIN" "$BIN"
          echo "${GITHUB_SHA::8}" > VERSION
          sha256sum "$BIN" > "$BIN.sha256"
          [ "$GITHUB_REF_NAME" = main ] && TAG="sha-${GITHUB_SHA::8}" || TAG="$GITHUB_REF_NAME-${GITHUB_SHA::8}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "${{ env.TAG }} (${{ github.sha }})"
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            ${{ github.event.repository.name }}
            ${{ github.event.repository.name }}.sha256
            VERSION

  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.EDGE_STATE_APP_ID }}
          private-key: ${{ secrets.EDGE_STATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: edge-state
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edge-state
          token: ${{ steps.token.outputs.token }}
          # ci/bump rebases when two app repos race to push. A shallow clone
          # cannot rebase.
          fetch-depth: 0
      - run: ci/bump "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ needs.build.outputs.tag }}"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
