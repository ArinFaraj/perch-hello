# Perch app release workflow. Copy to .github/workflows/release.yml in a new
# app repo. Builds a static ARM64 binary and publishes the `latest` release that
# Perch pulls. Requires the cargo package name to equal the repo name.
name: build-release
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Package
        id: pkg
        run: |
          BIN="${GITHUB_REPOSITORY##*/}"           # binary == repo name
          cp "target/aarch64-unknown-linux-musl/release/$BIN" "$BIN"
          echo "${GITHUB_SHA::8}" > VERSION
          # main publishes sha-<short>; any other branch prefixes its own name.
          # A branch cut from main starts on the same commit, and one tag for
          # two lines would have re-published the production release as a
          # prerelease the first time dev built.
          [ "$GITHUB_REF_NAME" = main ] && TAG="sha-${GITHUB_SHA::8}" || TAG="$GITHUB_REF_NAME-${GITHUB_SHA::8}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          sha256sum "$BIN" > "$BIN.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "${{ env.TAG }} (${{ github.sha }})"
          prerelease: ${{ github.ref_name != 'main' }}
          files: |
            ${{ github.event.repository.name }}
            ${{ github.event.repository.name }}.sha256
            VERSION

  # Tell edge-state what was built. It decides what that feeds and whether the
  # change needs approval, so adding an environment never means editing this
  # repo. See docs/STATE-SPEC.md, "Promotion".
  bump:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.EDGE_STATE_APP_ID }}
          private-key: ${{ secrets.EDGE_STATE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: edge-state
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/edge-state
          token: ${{ steps.token.outputs.token }}
          # ci/bump rebases when two app repos race to push here.
          fetch-depth: 0
      - run: ci/bump "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "${{ needs.build.outputs.tag }}"
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
